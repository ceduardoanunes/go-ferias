# Serve o frontend (index.html) e faz proxy de /api/ → PostgREST.
# Assim o Store.pgUrl='/api' do frontend funciona sem alteração, e o layout
# espelha produção (Traefik/nginx com o mesmo prefixo /api).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # PostgREST atrás de /api/ (o prefixo /api é removido antes de repassar)
  location /api/ {
    proxy_pass         http://postgrest:3000/;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # PostgREST usa estes headers para paginação/representação
    proxy_hide_header  Content-Location;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
